name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    # Per module. govulncheck stops at a module boundary like every other Go
    # tool, so a run at the root sees the standard library and two test
    # dependencies — while watchdogprom carries client_golang and everything it
    # pulls in, which is the repo's entire third-party surface.
    strategy:
      fail-fast: false
      matrix:
        module: [".", "watchdogprom"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          repo-checkout: false
          work-dir: ${{ matrix.module }}
